# Compositor config for the greetd greeter (installed to /etc/greetd/hyprland.conf).
# It runs as the `greeter` user and hosts nothing but the quickshell greeter surface.

monitor = , preferred, auto, auto

env = XDG_CURRENT_DESKTOP,Hyprland
env = QT_QPA_PLATFORMTHEME,qt6ct

# install.sh rewrites the placeholder to wherever this config tree actually lives — the
# `greeter` account has its own $HOME, so the path has to be absolute here.
exec-once = qs -p @GREETER_ENTRY@

# Same keyboard setup as the user session, so the password is typed with the expected layout.
input {
    kb_layout = us,ru
    kb_options = grp:caps_toggle
    numlock_by_default = true
    follow_mouse = 1
}

general {
    border_size = 0
    gaps_in = 0
    gaps_out = 0
}

decoration {
    rounding = 0
    blur {
        enabled = false
    }
}

animations {
    enabled = false
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    background_color = 0x000000
}

# Escape hatch: quit the compositor so greetd restarts the greeter if it ever wedges.
bind = CTRL ALT, Delete, exit

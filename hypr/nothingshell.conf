# nothingshell — Hyprland integration.
#
#   source = ~/.config/quickshell/nothingshell/hypr/nothingshell.conf
#
# from your hyprland.conf, or copy the lines you want. Nothing here configures Hyprland itself
# (no monitors, no window rules beyond what the shell needs) — it is only the wiring between the
# compositor and the shell.
#
# `qs -c nothingshell` is all there is to it: the clone lives at ~/.config/quickshell/nothingshell,
# which is exactly where quickshell looks for a config of that name.

# --- Startup -----------------------------------------------------------------------------
# The baked shaders come with the clone, so there is nothing to build before starting.
exec-once = qs -c nothingshell

# --- Layer rules -------------------------------------------------------------------------
# The shell animates its own panels; letting Hyprland animate the layer surfaces as well fights
# it (the bar slides while the frame behind it eases separately).
layerrule = no_anim on, match:namespace ^(quickshell)$

# --- Shell keybinds ----------------------------------------------------------------------
# The launcher: apps, and prefixes for commands (>), clipboard (#), calculator (=), a shell
# command ($) and emoji (:).
bind = SUPER, space, exec, qs -c nothingshell ipc call launcher toggle
# Open it straight into a mode, e.g. the theme carousel.
# bind = SUPER SHIFT, space, exec, qs -c nothingshell ipc call launcher open '>theme'

# The lock screen. The session menu has no binding on purpose — it is the power button at the
# bottom of the bar, which opens on hover, and one fewer key taken out of your config. Bind it
# yourself if you want one: qs -c nothingshell ipc call session toggle
bind = SUPER ALT, L, exec, qs -c nothingshell ipc call lock lock

# Settings window, optionally deep-linked to a page id (see modules/settings/PageRegistry.qml).
bind = SUPER, N, exec, qs -c nothingshell ipc call settings toggle
# bind = SUPER SHIFT, N, exec, qs -c nothingshell ipc call settings open appearance

# Media keys through MPRIS, so playerctl is not needed.
bindl = , XF86AudioPlay,  exec, qs -c nothingshell ipc call media playpause
bindl = , XF86AudioPause, exec, qs -c nothingshell ipc call media playpause
bindl = , XF86AudioNext,  exec, qs -c nothingshell ipc call media next
bindl = , XF86AudioPrev,  exec, qs -c nothingshell ipc call media previous

# --- Screenshots and recording -----------------------------------------------------------
# The shell owns the whole flow: it takes its own panels out of the frame first, remembers the
# format/fps/audio settings, and drives pause and stop from the bar.
bind = , Print,            exec, qs -c nothingshell ipc call capture shot region
bind = CTRL, Print,        exec, qs -c nothingshell ipc call capture shot screen
bind = SUPER, Print,       exec, qs -c nothingshell ipc call capture panel
bind = SUPER SHIFT, Print, exec, qs -c nothingshell ipc call capture toggle
bind = SUPER ALT, Print,   exec, qs -c nothingshell ipc call capture pause
# Works with the shell stopped, which is the point of keeping it.
bind = SUPER CTRL, Print,  exec, sh -c 'grim -g "$(slurp)" - | wl-copy'

# --- Clipboard history --------------------------------------------------------------------
# The history skips anything a password manager marks as a secret, but nothing marks a password
# typed into a form by hand. `pause` stops recording without discarding what is already there.
# bind = SUPER SHIFT, V, exec, qs -c nothingshell ipc call clipboard toggle
# bind = SUPER CTRL, V,  exec, qs -c nothingshell ipc call clipboard clear

# --- Game mode -----------------------------------------------------------------------------
# Drops animations, blur, shadows, gaps and rounding, and suppresses notifications and idle.
# Leaving it re-runs `hyprctl reload`, which restores whatever your config says.
# bind = SUPER, G, exec, qs -c nothingshell ipc call gamemode toggle

# --- Written by the shell ------------------------------------------------------------------
# Settings > Displays and Settings > Language & input regenerate these two files in full and
# apply the change live. Both live in the shell's own config directory, which it creates on
# startup. Source them LAST so they win over anything above, and do not hand-edit them: the next
# change from the settings window overwrites the file wholesale.
#
# Commented out because a missing file is a hard error in Hyprland, and these two are created —
# empty, which is fine — the first time the shell starts. Uncomment them after that first start;
# they stay empty until you open either settings page, and are overwritten in full when you do.
#
#   source = ~/.config/nothingshell/hypr/monitors.conf
#   source = ~/.config/nothingshell/hypr/input.conf
